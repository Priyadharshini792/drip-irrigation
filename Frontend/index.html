<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drip Irrigation Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f7f2; margin: 0; padding: 24px; color: #1f2d1f; }
    h1 { margin-top: 0; }
    #status { margin-bottom: 12px; font-size: 14px; }
    .banner { padding: 16px 20px; border-radius: 12px; font-size: 18px; font-weight: bold; margin-bottom: 16px; }
    .waiting { background: #e6e6e6; color: #444444; }
    .ok { background: #d4f4dd; color: #14532d; }
    .fault { background: #fddede; color: #7f1d1d; }
    .info { background: #e3edf9; color: #1e3a5f; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); }
    .label { font-size: 14px; color: #556655; }
    .value { font-size: 36px; font-weight: bold; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Drip Irrigation Monitor</h1>
  <div id="status">Connecting...</div>
  <div id="banner" class="banner waiting">Waiting for data...</div>

  <div class="grid">
    <div class="card">
      <div class="label">Temperature (sensor)</div>
      <div class="value"><span id="temperature">--</span> &deg;C</div>
    </div>
    <div class="card">
      <div class="label">Humidity (sensor)</div>
      <div class="value"><span id="humidity">--</span> %</div>
    </div>
    <div class="card">
      <div class="label">Soil moisture (sensor)</div>
      <div class="value"><span id="moisture">--</span> %</div>
    </div>
    <div class="card">
      <div class="label">Water flow (simulated)</div>
      <div class="value"><span id="flow">--</span> L/min</div>
    </div>
  </div>

  <script>
    function showBanner(text, kind) {
      const banner = document.getElementById("banner");
      banner.textContent = text;
      banner.className = "banner " + kind;
    }

    function show(id, value) {
      document.getElementById(id).textContent = value === null ? "--" : value;
    }

    async function refresh() {
      const status = document.getElementById("status");
      try {
        const response = await fetch("/zones");
        const zones = await response.json();
        const zone = zones["1"];

        if (!zone) {
          status.textContent = "Connected. Waiting for the first reading...";
          showBanner("Waiting for data...", "waiting");
          return;
        }

        show("temperature", zone.temperature);
        show("humidity", zone.humidity);
        show("moisture", zone.moisture);
        show("flow", zone.flow);

        status.textContent = "Sensors updated: " + (zone.sensors_updated_at || "never") +
          "  |  Flow (simulated) updated: " + (zone.flow_updated_at || "never");

        if (zone.verdict.status === "OK") {
          showBanner("OK - " + zone.verdict.message, "ok");
        } else if (zone.verdict.status === "NO_SENSOR") {
          showBanner(zone.verdict.message, "info");
        } else {
          showBanner("FAULT - " + zone.verdict.message, "fault");
        }
      } catch (error) {
        status.textContent = "Cannot reach the server. Is it running?";
        showBanner("No data - server unreachable", "waiting");
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
